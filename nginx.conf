server {
    listen 80;
    client_max_body_size 10M;
    resolver 127.0.0.11 valid=10s;

    # Роздача завантажених зображень напряму з Docker volume
    # (точний збіг "/images" нижче для сторінки-галереї має вищий пріоритет
    # за замовчуванням, тому конфлікту з "/images/<файл>" тут немає)
    location /images/ {
        alias /images/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Головна сторінка — статичний шаблон, який вітає користувача
    location = / {
        root /usr/share/nginx/html/static;
        try_files /index.html =404;
    }

    # POST /upload -> бекенд (сама сторінка форми тепер віддається через /form/upload.html)
    location = /upload {
        set $backend "app:8000";
        client_max_body_size 5M;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статичні сторінки шаблону за реальними шляхами: /form/upload.html, /form/images.html
    location /form/ {
        alias /usr/share/nginx/html/static/form/;
    }

    # CSS/JS/іконки шаблону — HTML посилається на них як "image-uploader/..."
    location /image-uploader/ {
        alias /usr/share/nginx/html/static/image-uploader/;
    }

    # Все інше (додаткові API-маршрути) проксується на Python-бекенд
    location / {
        set $backend "app:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}